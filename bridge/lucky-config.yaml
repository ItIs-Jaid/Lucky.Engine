# HLCO Configuration

## Token Limits
max_tokens: 2000

## Matching
confidence_threshold: 0.8

## Audit
audit_max_lines: 5000

## Skill Priorities (higher = prefer loading first)
skill_weights:
  memory-graph: 1.0
  hermes-agent: 0.9
  graphify: 0.95
  finances: 1.0
  agent-skills: 0.9
  security: 0.85
  research: 0.85
  productivity: 0.85
  devops: 0.85
  software-development: 0.85
  creative: 0.85
  mlops: 0.85
  github: 0.85
  learning: 0.85
  note-taking: 0.85
  autonomous-ai-agents: 0.85
  mcp: 0.85
  project: 0.85

## Query Defaults
default_budget: 500
fallback_budget: 1500
cache_enabled: false
